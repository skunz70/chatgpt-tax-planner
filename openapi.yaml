openapi: 3.0.1
info:
  title: Tax Planner Upload API
  description: Upload a tax return PDF, generate planning output, and create final Valhalla client reports.
  version: "1.1.0"
servers:
  - url: https://chatgpt-tax-planner.onrender.com
paths:
  /parse_1040:
    post:
      summary: Upload and parse a 1040 tax return
      operationId: parse1040
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Parsed tax data
          content:
            application/json:
              schema:
                type: object
                properties:
                  filing_status:
                    type: string
                  agi:
                    type: number
                  taxable_income:
                    type: number
                  total_tax:
                    type: number
                  withholding:
                    type: number
                  estimated_payments:
                    type: number
                  total_payments:
                    type: number
                  balance_due:
                    type: number

  /generate_valhalla_premium_docx:
    post:
      summary: Generate the final approved Valhalla Premium DOCX report
      description: Call this operation when the user has approved the tax plan and asks for the final Valhalla Premium DOCX report. If no client data is supplied during an action test, call this operation with an empty JSON object {} and the backend will use default test values. The response is always JSON and contains a download_url for the generated DOCX file.
      operationId: generateValhallaPremiumDocx
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValhallaPremiumReportInput'
      responses:
        '200':
          description: Pure JSON result for GPT Actions. The DOCX is saved by the backend and exposed through the returned download_url.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValhallaPremiumDocxResponse'

  /generate_pdf:
    post:
      summary: Generate a customized tax plan report
      operationId: generateTaxPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filing_status:
                  type: string
                agi:
                  type: number
                taxable_income:
                  type: number
                total_tax:
                  type: number
                strategies:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: A PDF report of tax strategies
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /year_end_plan:
    post:
      summary: Create year-end planning strategy
      operationId: yearEndPlanning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agi:
                  type: number
                filing_status:
                  type: string
                business_income:
                  type: number
                retirement_plan_type:
                  type: string
      responses:
        '200':
          description: Strategy suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  strategies:
                    type: array
                    items:
                      type: string

  /upload:
    get:
      summary: HTML upload form for 1040 PDFs
      operationId: getUploadForm
      responses:
        '200':
          description: HTML form to upload PDF
          content:
            text/html:
              schema:
                type: string

components:
  schemas:
    ValhallaPremiumReportInput:
      type: object
      description: Optional final-report inputs. For action testing, this may be omitted or sent as {}. In the real workflow, pass the client facts and reviewed planning data from generateTaxPlan.
      properties:
        client_name:
          type: string
          default: Test Client
          example: Test Client
        tax_year:
          type: integer
          default: 2025
          example: 2025
        filing_status:
          type: string
          default: MFJ
          example: MFJ
        agi:
          type: number
          default: 185000
          example: 185000
        taxable_income:
          type: number
          default: 142000
          example: 142000
        total_tax:
          type: number
          default: 24000
          example: 24000
        refund:
          type: number
          default: 1200
          example: 1200
        balance_due:
          type: number
          default: 0
          example: 0
        federal_withholding:
          type: number
          default: 22800
          example: 22800
        dependents:
          type: integer
          default: 2
          example: 2
        state:
          type: string
          default: AZ
          example: AZ
        schedule_c_gross_revenue:
          type: number
          default: 280000
          example: 280000
        schedule_c_net_profit:
          type: number
          default: 95000
          example: 95000
        contract_labor:
          type: number
          default: 107920
          example: 107920
        w2_income:
          type: number
          default: 90000
          example: 90000
        capital_gains:
          type: number
          default: 18000
          example: 18000
        dividend_income:
          type: number
          default: 3500
          example: 3500
        interest_income:
          type: number
          default: 1200
          example: 1200
        has_retirement_accounts:
          type: boolean
          default: false
          example: true
        age:
          type: number
          default: 64
          example: 64
        aca_marketplace:
          type: boolean
          default: false
          example: false
        logo_path:
          type: string
          default: valhalla_logo.jpg
          example: valhalla_logo.jpg

    ValhallaPremiumDocxResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - message
        - filename
        - content_type
        - download_url
        - download_path
      properties:
        status:
          type: string
          enum:
            - success
            - error
          example: success
        message:
          type: string
          example: Valhalla Premium DOCX report generated successfully.
        filename:
          type: string
          example: valhalla_premium_Test_Client_2025.docx
        content_type:
          type: string
          example: application/vnd.openxmlformats-officedocument.wordprocessingml.document
        download_url:
          type: string
          example: https://chatgpt-tax-planner.onrender.com/generated_reports/valhalla_premium_Test_Client_2025.docx
        download_path:
          type: string
          example: /generated_reports/valhalla_premium_Test_Client_2025.docx
