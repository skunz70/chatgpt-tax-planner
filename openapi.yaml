openapi: 3.0.1
info:
  title: Valhalla Tax Planner API
  description: Upload tax data, preview dynamic strategy analysis, and generate premium Valhalla tax planning reports.
  version: "1.1.0"
servers:
  - url: https://chatgpt-tax-planner.onrender.com
paths:
  /parse_1040:
    post:
      summary: Upload and parse a 1040 tax return
      operationId: parse1040
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Parsed tax data
          content:
            application/json:
              schema:
                type: object
                properties:
                  filing_status:
                    type: string
                  agi:
                    type: number
                  taxable_income:
                    type: number
                  total_tax:
                    type: number
                  withholding:
                    type: number
                  estimated_payments:
                    type: number
                  total_payments:
                    type: number
                  balance_due:
                    type: number

  /preview_valhalla_premium_strategy:
    post:
      summary: Preview dynamic Valhalla premium strategy and ROI analysis
      operationId: previewValhallaPremiumStrategy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValhallaPremiumReportInput'
      responses:
        '200':
          description: Dynamic strategy and ROI preview
          content:
            application/json:
              schema:
                type: object

  /generate_valhalla_premium_docx:
    post:
      summary: Generate a premium Valhalla DOCX tax strategy report
      operationId: generateValhallaPremiumDocx
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValhallaPremiumReportInput'
      responses:
        '200':
          description: Premium Word report
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary

  /generate_pdf:
    post:
      summary: Generate a customized tax plan report
      operationId: generateTaxPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filing_status:
                  type: string
                agi:
                  type: number
                taxable_income:
                  type: number
                total_tax:
                  type: number
                strategies:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: A PDF report of tax strategies
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /year_end_plan:
    post:
      summary: Create year-end planning strategy
      operationId: yearEndPlanning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agi:
                  type: number
                filing_status:
                  type: string
                business_income:
                  type: number
                retirement_plan_type:
                  type: string
      responses:
        '200':
          description: Strategy suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  strategies:
                    type: array
                    items:
                      type: string

  /upload:
    get:
      summary: HTML upload form for 1040 PDFs
      operationId: getUploadForm
      responses:
        '200':
          description: HTML form to upload PDF
          content:
            text/html:
              schema:
                type: string

components:
  schemas:
    ValhallaPremiumReportInput:
      type: object
      required:
        - client_name
        - tax_year
        - filing_status
        - agi
        - taxable_income
        - total_tax
      properties:
        client_name:
          type: string
          example: Test Client
        tax_year:
          type: integer
          example: 2025
        filing_status:
          type: string
          example: MFJ
        agi:
          type: number
          example: 185000
        taxable_income:
          type: number
          example: 142000
        total_tax:
          type: number
          example: 24000
        refund:
          type: number
          example: 1200
        balance_due:
          type: number
          example: 0
        federal_withholding:
          type: number
          example: 22800
        dependents:
          type: integer
          example: 2
        state:
          type: string
          example: AZ
        schedule_c_gross_revenue:
          type: number
          example: 280000
        schedule_c_net_profit:
          type: number
          example: 95000
        contract_labor:
          type: number
          example: 107920
        w2_income:
          type: number
          example: 90000
        capital_gains:
          type: number
          example: 18000
        dividend_income:
          type: number
          example: 3500
        interest_income:
          type: number
          example: 1200
        has_retirement_accounts:
          type: boolean
          example: true
        age:
          type: number
          example: 64
        aca_marketplace:
          type: boolean
          example: false
        logo_path:
          type: string
          example: valhalla_logo.jpg
