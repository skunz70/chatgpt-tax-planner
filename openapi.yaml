openapi: 3.0.1
info:
  title: Tax Planner Upload API
  description: Upload a tax return PDF, generate planning output, and create final Valhalla client reports.
  version: "1.1.0"
servers:
  - url: https://chatgpt-tax-planner.onrender.com
paths:
  /parse_1040:
    post:
      summary: Upload and parse a 1040 tax return
      operationId: parse1040
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Parsed tax data
          content:
            application/json:
              schema:
                type: object
                properties:
                  filing_status:
                    type: string
                  agi:
                    type: number
                  taxable_income:
                    type: number
                  total_tax:
                    type: number
                  withholding:
                    type: number
                  estimated_payments:
                    type: number
                  total_payments:
                    type: number
                  balance_due:
                    type: number

  /generate_valhalla_premium_docx:
    post:
      summary: Final client-ready downloadable Valhalla Premium DOCX report only
      description: This is the final report action. Call generateValhallaPremiumDocx immediately when the user approves the planning analysis or asks for the final client-ready report, downloadable DOCX report, final Valhalla Premium report, or final report file. Do not call generateTaxPlan or /generate_pdf for final report generation. Do not ask the user for missing Form 1040 line items before calling this action. Send whatever taxpayer facts, planning summary, and recommendations are already available in the conversation. Omit unknown fields. The backend will safely use defaults for missing optional values and still generate a DOCX. If no client data is supplied during an action test, call this operation with an empty JSON object {}. The response is always JSON and contains a download_url for the generated DOCX file.
      operationId: generateValhallaPremiumDocx
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValhallaPremiumReportInput'
      responses:
        '200':
          description: Pure JSON result for GPT Actions. The DOCX is saved by the backend and exposed through the returned download_url.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValhallaPremiumDocxResponse'

  /generate_pdf:
    post:
      summary: Planning preview and strategy analysis only, not the final report
      description: Use generateTaxPlan only for the initial planning preview, strategy analysis, and tax planning workflow. This operation is not the final client-ready report and must not be called after the user approves the plan or asks for the final DOCX/downloadable Valhalla Premium report. For final report generation, call generateValhallaPremiumDocx instead.
      operationId: generateTaxPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filing_status:
                  type: string
                agi:
                  type: number
                taxable_income:
                  type: number
                total_tax:
                  type: number
                strategies:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Planning preview or strategy response. Not a final client-ready DOCX report.
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /year_end_plan:
    post:
      summary: Create year-end planning strategy
      operationId: yearEndPlanning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agi:
                  type: number
                filing_status:
                  type: string
                business_income:
                  type: number
                retirement_plan_type:
                  type: string
      responses:
        '200':
          description: Strategy suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  strategies:
                    type: array
                    items:
                      type: string

  /upload:
    get:
      summary: HTML upload form for 1040 PDFs
      operationId: getUploadForm
      responses:
        '200':
          description: HTML form to upload PDF
          content:
            text/html:
              schema:
                type: string

components:
  schemas:
    ValhallaPremiumReportInput:
      type: object
      description: Optional final-report inputs. This schema has no required fields. For final report generation, do not wait for every Form 1040 line item. Pass the taxpayer facts, planning summary, and recommendations already available in the reviewed plan. Omit unknown fields; the backend fills missing optional values and generates the DOCX anyway.
      properties:
        client_name:
          type: string
          default: Test Client
          example: Carlos Santiago Lopez
        tax_year:
          type: integer
          default: 2025
          example: 2025
        filing_status:
          type: string
          default: MFJ
          example: Single
        agi:
          type: number
          default: 185000
          example: 76530
        taxable_income:
          type: number
          default: 142000
          example: 61000
        total_tax:
          type: number
          default: 24000
          example: 8200
        refund:
          type: number
          default: 1200
          example: 0
        balance_due:
          type: number
          default: 0
          example: 0
        federal_withholding:
          type: number
          default: 22800
          example: 0
        dependents:
          type: integer
          default: 2
          example: 1
        state:
          type: string
          default: AZ
          example: AZ
        schedule_c_gross_revenue:
          type: number
          default: 280000
          example: 0
        schedule_c_net_profit:
          type: number
          default: 95000
          example: 0
        contract_labor:
          type: number
          default: 107920
          example: 0
        w2_income:
          type: number
          default: 90000
          example: 0
        capital_gains:
          type: number
          default: 18000
          example: 0
        dividend_income:
          type: number
          default: 3500
          example: 0
        interest_income:
          type: number
          default: 1200
          example: 0
        has_retirement_accounts:
          type: boolean
          default: false
          example: true
        age:
          type: number
          default: 64
          example: 64
        aca_marketplace:
          type: boolean
          default: false
          example: false
        advisor_summary:
          type: string
          description: Optional summary from the reviewed plan to include in the DOCX.
        top_planning_focus:
          type: string
          description: Optional primary planning focus from the reviewed plan.
        planning_summary:
          type: string
          description: Optional plain-text planning summary from generateTaxPlan or chat review.
        final_recommendation:
          type: string
          description: Optional final advisor recommendation from the reviewed plan.
        tax_efficiency_score:
          type: number
          description: Optional tax efficiency score from the reviewed plan.
        priority_actions:
          type: array
          description: Optional ranked action items from the reviewed plan.
          items:
            type: object
            additionalProperties: true
        strategies:
          type: array
          description: Optional strategy names or recommendations from the reviewed plan.
          items:
            type: string
        dynamic_sections:
          type: array
          description: Optional report sections from the reviewed plan.
          items:
            type: object
            additionalProperties: true
        roi_strategies:
          type: array
          description: Optional ROI-ranked strategies from the reviewed plan.
          items:
            type: object
            additionalProperties: true
        logo_path:
          type: string
          default: valhalla_logo.jpg
          example: valhalla_logo.jpg

    ValhallaPremiumDocxResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - message
        - filename
        - content_type
        - download_url
        - download_path
      properties:
        status:
          type: string
          enum:
            - success
            - error
          example: success
        message:
          type: string
          example: Valhalla Premium DOCX report generated successfully.
        filename:
          type: string
          example: valhalla_premium_Carlos_Santiago_Lopez_2025.docx
        content_type:
          type: string
          example: application/vnd.openxmlformats-officedocument.wordprocessingml.document
        download_url:
          type: string
          example: https://chatgpt-tax-planner.onrender.com/generated_reports/valhalla_premium_Carlos_Santiago_Lopez_2025.docx
        download_path:
          type: string
          example: /generated_reports/valhalla_premium_Carlos_Santiago_Lopez_2025.docx
