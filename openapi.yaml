openapi: 3.0.1
info:
  title: Tax Planner Upload API
  description: Upload a tax return PDF and generate a customized tax planning report.
  version: "1.0.0"
servers:
  - url: https://chatgpt-tax-planner.onrender.com
paths:
  /gpt-tax-router:
    post:
      summary: GPT tax action router
      operationId: gptTaxRouter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: Action result payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GptTaxRouterResponse'
  /parse_1040:
    post:
      summary: Upload and parse a 1040 tax return
      operationId: parse1040
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Parsed tax data
          content:
            application/json:
              schema:
                type: object
                properties:
                  filing_status:
                    type: string
                  agi:
                    type: number
                  taxable_income:
                    type: number
                  total_tax:
                    type: number
                  withholding:
                    type: number
                  estimated_payments:
                    type: number
                  total_payments:
                    type: number
                  balance_due:
                    type: number

  /generate_pdf:
    post:
      summary: Generate a customized tax plan report
      operationId: generateTaxPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filing_status:
                  type: string
                agi:
                  type: number
                taxable_income:
                  type: number
                total_tax:
                  type: number
                strategies:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: A PDF report of tax strategies
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /year_end_plan:
    post:
      summary: Create year-end planning strategy
      operationId: yearEndPlanning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agi:
                  type: number
                filing_status:
                  type: string
                business_income:
                  type: number
                retirement_plan_type:
                  type: string
      responses:
        '200':
          description: Strategy suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  strategies:
                    type: array
                    items:
                      type: string

  /upload:
    get:
      summary: HTML upload form for 1040 PDFs
      operationId: getUploadForm
      responses:
        '200':
          description: HTML form to upload PDF
          content:
            text/html:
              schema:
                type: string

components:
  schemas:
    ActionRequest:
      type: object
      required:
        - action
      additionalProperties: true
      properties:
        action: { type: string }
        income: { type: number }
        client_name: { type: string }
        tax_year: { type: string }
        filing_status: { type: string }
        state: { type: string }
        agi: { type: number }
        taxable_income: { type: number }
        total_tax: { type: number }
        federal_withholding: { type: number }
        estimated_payments: { type: number }
        total_payments: { type: number }
        refund: { type: number }
        balance_due: { type: number }
        standard_deduction: { type: number }
        marginal_rate: { type: number }
        effective_rate: { type: number }
        w2_income: { type: number }
        interest_income: { type: number }
        dividend_income: { type: number }
        capital_gains: { type: number }
        ira_distributions: { type: number }
        pension_income: { type: number }
        business_income: { type: number }
        rental_income: { type: number }
        self_employment_tax: { type: number }
        retirement_contributions: { type: number }
        itemized_deductions: { type: number }
        mortgage_interest: { type: number }
        charitable_contributions: { type: number }
        credits: { type: number }
        confidence_engine: {}
        planning_status: { type: string }
    GptTaxRouterResponse:
      type: object
      additionalProperties: true
      properties:
        status: { type: string }
        message: { type: string }
        report_type: { type: string }
        report_text: { type: string }
        pdf_available: { type: boolean }
        pdf_message: { type: string }
        missing_fields:
          type: array
          items: { type: string }
        confidence_engine: {}
        planning_status: { type: string }
