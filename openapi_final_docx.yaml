openapi: 3.1.0
info:
  title: Valhalla Final DOCX Report API
  description: Dedicated schema for generating the final client-ready Valhalla Premium DOCX report.
  version: "1.0.0"
servers:
  - url: https://chatgpt-tax-planner.onrender.com
paths:
  /generate_final_report:
    post:
      summary: Generate the final downloadable client DOCX report
      description: Mandatory final-report action. When the planning analysis is complete and the user asks for a final report, downloadable report, client-ready report, Valhalla Premium report, or says to call generateFinalReport, call this operation. Use taxpayer and plan values already available in the conversation, omit unknown optional fields, and return/display the download_url. Do not use generateTaxPlan for the final report.
      operationId: generateFinalReport
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValhallaPremiumReportInput'
      responses:
        '200':
          description: JSON result with generated DOCX filename and download URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValhallaPremiumDocxResponse'
components:
  schemas:
    ValhallaPremiumReportInput:
      type: object
      description: Optional inputs. Pass available taxpayer facts and reviewed plan data. Omit unknown fields.
      properties:
        client_name:
          type: string
          default: Test Client
          example: Carlos Santiago Lopez
        tax_year:
          type: integer
          default: 2025
          example: 2025
        filing_status:
          type: string
          default: MFJ
          example: Single
        agi:
          type: number
          default: 185000
          example: 76530
        taxable_income:
          type: number
          default: 142000
          example: 61000
        total_tax:
          type: number
          default: 24000
          example: 8200
        refund:
          type: number
          default: 1200
          example: 0
        balance_due:
          type: number
          default: 0
          example: 0
        federal_withholding:
          type: number
          default: 22800
          example: 0
        dependents:
          type: integer
          default: 2
          example: 1
        state:
          type: string
          default: AZ
          example: AZ
        schedule_c_gross_revenue:
          type: number
          default: 280000
          example: 0
        schedule_c_net_profit:
          type: number
          default: 95000
          example: 0
        contract_labor:
          type: number
          default: 107920
          example: 0
        w2_income:
          type: number
          default: 90000
          example: 0
        capital_gains:
          type: number
          default: 18000
          example: 0
        dividend_income:
          type: number
          default: 3500
          example: 0
        interest_income:
          type: number
          default: 1200
          example: 0
        has_retirement_accounts:
          type: boolean
          default: false
          example: true
        age:
          type: number
          default: 64
          example: 64
        aca_marketplace:
          type: boolean
          default: false
          example: false
        advisor_summary:
          type: string
          description: Optional plan summary.
        top_planning_focus:
          type: string
          description: Optional primary planning focus.
        planning_summary:
          type: string
          description: Optional planning summary.
        final_recommendation:
          type: string
          description: Optional final recommendation.
        tax_efficiency_score:
          type: number
          description: Optional tax efficiency score.
        priority_actions:
          type: array
          description: Optional ranked actions.
          items:
            type: object
            additionalProperties: true
        strategies:
          type: array
          description: Optional strategy names.
          items:
            type: string
        dynamic_sections:
          type: array
          description: Optional report sections.
          items:
            type: object
            additionalProperties: true
        roi_strategies:
          type: array
          description: Optional ROI strategies.
          items:
            type: object
            additionalProperties: true
        logo_path:
          type: string
          default: valhalla_logo.jpg
          example: valhalla_logo.jpg
    ValhallaPremiumDocxResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - message
        - filename
        - content_type
        - download_url
        - download_path
      properties:
        status:
          type: string
          enum:
            - success
            - error
          example: success
        message:
          type: string
          example: Valhalla Premium DOCX report generated successfully.
        filename:
          type: string
          example: valhalla_premium_Carlos_Santiago_Lopez_2025.docx
        content_type:
          type: string
          example: application/vnd.openxmlformats-officedocument.wordprocessingml.document
        download_url:
          type: string
          example: https://chatgpt-tax-planner.onrender.com/generated_reports/valhalla_premium_Carlos_Santiago_Lopez_2025.docx
        download_path:
          type: string
          example: /generated_reports/valhalla_premium_Carlos_Santiago_Lopez_2025.docx
